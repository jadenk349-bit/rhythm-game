# Render Blueprint: creates the game server and its Postgres database together.
# On Render: New → Blueprint → pick this repo. Render asks for ADMIN_PASSCODE once.
services:
  - type: web
    name: rhythm-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rhythm-game-db
          property: connectionString
      - key: ADMIN_PASSCODE
        sync: false # you type this in on Render; it is never stored in the repo

databases:
  - name: rhythm-game-db
    plan: free
